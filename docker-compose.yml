services:
  db:
    image: postgres:16
    container_name: db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-my_db}
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-root} -d ${POSTGRES_DB:-my_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

    volumes:
      - ./.docker/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    restart: unless-stopped

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

    command: server /data --console-address ":9001"

    volumes:
      - ./minio-data:/data

  minio-mc:
    image: quay.io/minio/mc:latest
    container_name: minio_mc
    restart: no

    depends_on:
      minio:
        condition: service_healthy
        
    entrypoint:
      - /bin/sh
      - -c

    command:
      - |
        /usr/bin/mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
        /usr/bin/mc mb --ignore-existing local/${MINIO_BUCKET_NAME:-media}

  mailhog:
    image: mailhog/mailhog:latest
    container_name: mailhog
    restart: unless-stopped

    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped

    ports:
      - "${REDIS_PORT:-6379}:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
